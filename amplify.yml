version: 1
frontend:
  phases:
    build:
      commands:
        - echo "Deploying SanatanOrigin static web application..."
  artifacts:
    baseDirectory: .
    files:
      - '**/*'
  cache:
    paths: []
  customHeaders:
    - pattern: '**/*.js'
      headers:
        - key: 'Content-Type'
          value: 'application/javascript; charset=utf-8'
        - key: 'Cache-Control'
          value: 'public, max-age=0, must-revalidate'
    - pattern: '**/*.css'
      headers:
        - key: 'Content-Type'
          value: 'text/css; charset=utf-8'
        - key: 'Cache-Control'
          value: 'public, max-age=0, must-revalidate'
    - pattern: 'index.html'
      headers:
        - key: 'Content-Type'
          value: 'text/html; charset=utf-8'
        - key: 'Cache-Control'
          value: 'public, max-age=0, must-revalidate'
    - pattern: '**/*'
      headers:
        - key: 'X-Frame-Options'
          value: 'SAMEORIGIN'
        - key: 'X-Content-Type-Options'
          value: 'nosniff'
        - key: 'Referrer-Policy'
          value: 'strict-origin-when-cross-origin'
