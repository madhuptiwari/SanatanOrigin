<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Cosmic background gradient matching .om-symbol-emblem -->
    <radialGradient id="cosmicBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2D154B" />
      <stop offset="60%" stop-color="#140A28" />
      <stop offset="100%" stop-color="#090514" />
    </radialGradient>
    
    <!-- Golden radial aura glow -->
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE066" stop-opacity="0.6" />
      <stop offset="45%" stop-color="#FF9900" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0" />
    </radialGradient>

    <!-- Om text gradient -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="40%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FF9933" />
    </linearGradient>

    <!-- Outer soft halo filter -->
    <filter id="sacredGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComponentTransfer in="blur" result="boostBlur">
        <feFuncA type="linear" slope="1.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="boostBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Cosmic Body -->
  <circle cx="32" cy="32" r="30.5" fill="url(#cosmicBg)" />
  <circle cx="32" cy="32" r="28" fill="url(#auraGlow)" />

  <!-- Dual Sacred Golden Concentric Rings -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="#FFD700" stroke-width="1.5" filter="url(#sacredGlow)" />
  <circle cx="32" cy="32" r="27" fill="none" stroke="#FF9933" stroke-width="0.8" stroke-dasharray="2.5 2.5" opacity="0.6" />

  <!-- Sacred Pranava ॐ Symbol -->
  <text x="32" y="42.5" 
        font-family="'Noto Serif Devanagari', 'Sanskrit Text', 'Mangal', 'Kokila', 'Nirmala UI', 'Arial Unicode MS', sans-serif" 
        font-size="33" 
        font-weight="bold" 
        text-anchor="middle" 
        fill="url(#goldText)" 
        filter="url(#sacredGlow)">ॐ</text>
</svg>
